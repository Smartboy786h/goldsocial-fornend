function showAuthError(message){const el=document.getElementById('authMessage');if(el){el.textContent=message;el.style.display='block';}else toast(message);}
function registerDemo(){
 const name=(document.getElementById('demoAuthName')?.value||'').trim().toLowerCase();
 const display=(document.getElementById('demoRegDisplay')?.value||'').trim();
 const password=document.getElementById('demoAuthPassword')?.value||'';
 const confirmPassword=document.getElementById('demoAuthConfirm')?.value||'';
 if(!display){showAuthError('আপনার নাম লিখুন।');return;}
 if(name.length<3){showAuthError('Username / Email কমপক্ষে ৩ অক্ষরের হতে হবে।');return;}
 if(password.length<6){showAuthError('Password কমপক্ষে ৬ অক্ষরের দিন।');return;}
 if(password!==confirmPassword){showAuthError('Confirm password মিলছে না।');return;}
 if(demoAccounts.some(a=>a.username.toLowerCase()===name)){showAuthError('এই username/email আগে থেকেই আছে। Login করুন অথবা অন্য username দিন।');return;}
 const account={username:name,displayName:display,accountId:makeAccountId(),password:password,createdAt:new Date().toISOString()};
 demoAccounts.push(account);saveDemoAccounts();
 demoSession={loggedIn:true,username:account.username,accountId:account.accountId};
 try{localStorage.setItem('goldDemoSession',JSON.stringify(demoSession));localStorage.setItem('goldDemoProfile',JSON.stringify({name:display,email:name.includes('@')?name:'',avatar:''}));localStorage.setItem('goldDemoWallet_'+account.accountId,JSON.stringify({deposit:0,withdrawal:0,purchases:0,records:[]}));}catch(e){}
 demoProfile={name:display,email:name.includes('@')?name:'',avatar:''};demoWallet={deposit:0,withdrawal:0,purchases:0,records:[]};saveWallet();
 showAccount();syncProfile();toast('Registration successful! Your Account ID: '+account.accountId);
}
function loginDemo(){
 const name=(document.getElementById('demoAuthName')?.value||'').trim().toLowerCase();
 const password=document.getElementById('demoAuthPassword')?.value||'';
 if(!name||!password){showAuthError('Username/email এবং password লিখুন।');return;}
 const account=demoAccounts.find(a=>a.username.toLowerCase()===name);
 if(!account){showAuthError('Account পাওয়া যায়নি। আগে Register করুন।');return;}
 if(account.password!==password){showAuthError('Wrong password! আবার চেষ্টা করুন।');return;}
 demoSession={loggedIn:true,username:account.username,accountId:account.accountId};
 try{localStorage.setItem('goldDemoSession',JSON.stringify(demoSession));const prof=JSON.parse(localStorage.getItem('goldDemoProfile_'+account.accountId)||'null');if(prof){demoProfile=prof;localStorage.setItem('goldDemoProfile',JSON.stringify(demoProfile));}else{demoProfile={name:account.displayName,email:account.username.includes('@')?account.username:'',avatar:''};localStorage.setItem('goldDemoProfile',JSON.stringify(demoProfile));}const w=JSON.parse(localStorage.getItem('goldDemoWallet_'+account.accountId)||'null');demoWallet=w&&typeof w.deposit==='number'?w:{deposit:0,withdrawal:0,records:[]};saveWallet();}catch(e){}
 showAccount();syncProfile();toast('Login successful! Account ID: '+account.accountId);
}
function logoutDemo(){
 if(demoSession.accountId){try{localStorage.setItem('goldDemoProfile_'+demoSession.accountId,JSON.stringify(demoProfile));localStorage.setItem('goldDemoWallet_'+demoSession.accountId,JSON.stringify(demoWallet));}catch(e){}}
 demoSession={loggedIn:false,username:'',accountId:''};try{localStorage.setItem('goldDemoSession',JSON.stringify(demoSession));}catch(e){}showLogin('login');toast('Signed out.');
}

function chooseWalletAmount(amount){const field=document.getElementById('walletAmount');if(field)field.value=amount;}
function switchRechargeMethod(){const method=document.getElementById('rechargeMethod')?.value||'qr';const qr=document.getElementById('qrPay');const upi=document.getElementById('upiPay');if(qr)qr.style.display=method==='qr'?'block':'none';if(upi)upi.style.display=method==='upi'?'block':'none';}
function submitWallet(type){
 const field=document.getElementById('walletAmount');
 const amount=Number(field&&field.value);
 if(!Number.isFinite(amount)||amount<=0){toast('সঠিক amount লিখুন।');return}
 if(type==='withdraw'&&amount<210){toast('Minimum withdrawal amount ₹210।');return}
 if(type==='deposit'){
  const txn=(document.getElementById('walletTxn')?.value||'').trim();
  if(!txn){toast('UPI Transaction ID / UTR লিখুন।');return}
  demoWallet.records.unshift({type:'deposit',amount,time:new Date().toLocaleString(),status:'Pending verification',txn});
  saveWallet();
  document.getElementById('products').innerHTML=`<div class="notice-header"><button onclick="showAccount()">‹</button>Deposit Request</div><div class="wallet-modal"><h3>Request submitted (Pending)</h3><p>Amount: <b>₹${money(amount)}</b></p><p>Transaction ID: <b>${txn.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}</b></p><p class="pending-note">এটি শুধু local demo request। সার্ভার বা PhonePe payment verification যুক্ত নেই, তাই টাকা পাওয়া বা balance credit হওয়া নিশ্চিত নয়।</p></div>`;
  return;
 }
 if(amount>walletBalance()){toast('Demo balance-এর চেয়ে বেশি withdraw করা যাবে না।');return}
 demoWallet.withdrawal+=amount;
 demoWallet.records.unshift({type:'withdraw',amount,time:new Date().toLocaleString(),status:'Demo'});
 saveWallet();showAccount();toast('Demo withdrawal হিসাব আপডেট হয়েছে।');
}

const originalSubmitWalletForEnhancements=submitWallet;
submitWallet=function(type){
 if(type!=='withdraw'){return originalSubmitWalletForEnhancements(type)}
 const field=document.getElementById('walletAmount');const amount=Number(field&&field.value);
 if(!Number.isFinite(amount)||amount<=0){toast('সঠিক amount লিখুন।');return}
 if(amount<210){toast('Minimum withdrawal amount ₹210।');return}
 if(amount>walletBalance()){toast('Demo balance-এর চেয়ে বেশি withdraw করা যাবে না।');return}
 demoWallet.records.unshift({type:'withdraw',amount,time:new Date().toLocaleString(),status:'Pending demo review'});saveWallet();
 document.getElementById('products').innerHTML=`<div class="notice-header"><button onclick="showAccount()">‹</button>Withdrawal Request</div><div class="wallet-modal"><h3>Demo request saved</h3><p>Amount: <b>₹${money(amount)}</b></p><p class="pending-note">Status: Pending demo review. কোনো বাস্তব টাকা পাঠানো হয়নি এবং balance কাটা হয়নি।</p><button class="account-action" onclick="showWalletHistory('withdraw')">View withdrawal history</button></div>`;
}

</script>
<script>
// GoldSocial online integration. Configure a deployed HTTPS API URL in Online Database Setup.
const goldApiBase = () => (localStorage.getItem('goldApiBase') || '').trim().replace(/\/$/, '');
const goldApiToken = () => localStorage.getItem('goldApiToken') || '';
async function goldApi(path, options={}) {
 const base=goldApiBase(); if(!base) throw new Error('Online API URL সেট করা হয়নি। Account → Online Database Setup খুলুন।');
 const headers={'Content-Type':'application/json',...(options.headers||{})}; if(goldApiToken())headers.Authorization='Bearer '+goldApiToken();
 let response; try { response=await fetch(base+path,{...options,headers}); } catch(e) { throw new Error('Backend-এ সংযোগ করা যাচ্ছে না। URL, HTTPS এবং CORS settings পরীক্ষা করুন।'); }
 const data=await response.json().catch(()=>({error:'Invalid server response'})); if(!response.ok)throw new Error(data.error||('Request failed ('+response.status+')')); return data;
}
function goldSetOnlineUser(data){
 localStorage.setItem('goldApiToken',data.token); demoSession={loggedIn:true,username:data.user.username,accountId:data.user.accountId};
 demoProfile={name:data.user.displayName,email:data.user.username.includes('@')?data.user.username:'',avatar:''};
 demoWallet={deposit:Number(data.user.balancePaise||0)/100,withdrawal:0,purchases:0,records:[]};
 try{localStorage.setItem('goldDemoSession',JSON.stringify(demoSession));localStorage.setItem('goldDemoProfile',JSON.stringify(demoProfile));}catch(e){}
}
const goldLocalRegister=registerDemo;
registerDemo=async function(){
 if(!goldApiBase())return goldLocalRegister();
 const displayName=(document.getElementById('demoRegDisplay')?.value||'').trim();
 const username=(document.getElementById('demoAuthName')?.value||'').trim().toLowerCase();
 const password=document.getElementById('demoAuthPassword')?.value||''; const confirmPassword=document.getElementById('demoAuthConfirm')?.value||'';
 if(!displayName||username.length<3){showAuthError('নাম এবং সঠিক username/email লিখুন।');return;} if(password.length<10){showAuthError('Online account-এর জন্য অন্তত ১০ অক্ষরের password দিন।');return;} if(password!==confirmPassword){showAuthError('Confirm password মিলছে না।');return;}
 try{const d=await goldApi('/api/auth/register',{method:'POST',body:JSON.stringify({displayName,username,password})});goldSetOnlineUser(d);await goldRefreshWallet();showAccount();syncProfile();toast('Online registration সফল। Account ID: '+d.user.accountId);}catch(e){showAuthError(e.message);}
};
const goldLocalLogin=loginDemo;
loginDemo=async function(){
 if(!goldApiBase())return goldLocalLogin();
 const username=(document.getElementById('demoAuthName')?.value||'').trim().toLowerCase();const password=document.getElementById('demoAuthPassword')?.value||'';
 if(!username||!password){showAuthError('Username/email এবং password লিখুন।');return;}
 try{const d=await goldApi('/api/auth/login',{method:'POST',body:JSON.stringify({username,password})});goldSetOnlineUser(d);await goldRefreshWallet();showAccount();syncProfile();toast('Online login সফল। Account ID: '+d.user.accountId);}catch(e){showAuthError(e.message);}
};
const goldLocalLogout=logoutDemo;
logoutDemo=function(){localStorage.removeItem('goldApiToken');goldLocalLogout();};
async function goldRefreshWallet(){const d=await goldApi('/api/wallet');demoWallet={deposit:Number(d.balancePaise||0)/100,withdrawal:0,purchases:0,records:(d.transactions||[]).map(t=>({type:t.kind==='withdrawal'?'withdraw':t.kind,amount:Number(t.amountPaise)/100,status:t.status,txn:t.reference||'',time:new Date(t.created_at).toLocaleString()}))};saveWallet();return d;}
function goldLoadRazorpay(){return new Promise((resolve,reject)=>{if(window.Razorpay)return resolve();const s=document.createElement('script');s.src='https://checkout.razorpay.com/v1/checkout.js';s.onload=resolve;s.onerror=()=>reject(new Error('Razorpay Checkout লোড হয়নি। Internet connection পরীক্ষা করুন।'));document.head.appendChild(s);});}
const goldLocalSubmitWallet=submitWallet;
submitWallet=async function(type){
 if(!goldApiBase()||!goldApiToken())return goldLocalSubmitWallet(type);
 const amount=Number(document.getElementById('walletAmount')?.value);if(!Number.isFinite(amount)||amount<=0){toast('সঠিক amount লিখুন।');return;}
 try{
  if(type==='withdraw'){
   const d=await goldApi('/api/withdrawals',{method:'POST',body:JSON.stringify({amount})});await goldRefreshWallet();toast(d.message||'Withdrawal request জমা হয়েছে।');showWalletHistory('withdraw');return;
  }
  if(amount<1||amount>100000){toast('₹1 থেকে ₹100,000-এর মধ্যে amount দিন।');return;}
  const order=await goldApi('/api/payments/order',{method:'POST',body:JSON.stringify({amount})});await goldLoadRazorpay();
  const checkout=new window.Razorpay({key:order.keyId,amount:order.amount,currency:order.currency,name:order.name,description:order.description,order_id:order.orderId,prefill:{name:demoProfile.name||'',email:demoProfile.email||''},theme:{color:'#d4af37'},handler:async function(response){
    try{const v=await goldApi('/api/payments/verify',{method:'POST',body:JSON.stringify(response)});demoProfile.name=v.user.displayName;await goldRefreshWallet();toast('Payment server-side verified. Wallet balance updated.');showAccount();}
    catch(e){toast('Payment verification pending/failed: '+e.message+' Payment ID save করে support-এ দিন।');}
   },modal:{ondismiss:function(){toast('Checkout বন্ধ হয়েছে। Payment complete না হলে balance credit হবে না।');}}});
  checkout.on('payment.failed',function(response){toast('Payment failed: '+(response.error?.description||'Try again later.'));});checkout.open();
 }catch(e){toast(e.message);}
};
const goldLocalDatabaseInfo=showDatabaseInfo;
showDatabaseInfo=function(){
 const saved=goldApiBase();document.getElementById('products').innerHTML=`<div class="notice-header"><button onclick="showAccount()">‹</button>Online Database & Payment Setup</div><div class="wallet-modal"><h3>Connect your deployed backend</h3><p class="form-help">এখানে backend deploy করার পর তার HTTPS URL দিন। URL না থাকলে online database/payment এখনো চালু হয়নি।</p><label>Backend API HTTPS URL</label><input id="goldApiUrl" value="${safeText(saved)}" placeholder="https://your-api.example.com" autocomplete="url" style="width:100%;box-sizing:border-box;background:#0d274d;color:white;border:1px solid #42658f;border-radius:9px;padding:12px;margin:8px 0 12px"><button class="account-action" style="width:100%" onclick="goldSaveApiUrl()">Save API URL</button><button class="account-action" style="width:100%;margin-top:8px;background:#294a75;color:white" onclick="goldTestApi()">Test Database Connection</button><div id="goldApiStatus" class="admin-note" style="margin-top:12px">${saved?'Saved URL: '+safeText(saved):'Not connected yet.'}</div><div class="support-card"><b>Required before live use</b><p class="form-help">1. PostgreSQL database + schema.sql<br>2. Deploy GoldSocial_Backend project over HTTPS<br>3. Set DATABASE_URL, JWT_SECRET, Razorpay Test keys and webhook secret on the server<br>4. Razorpay webhook: /api/payments/webhook<br>5. Test a payment before switching to Live mode</p></div><p class="admin-note">Secret keys কখনো এখানে বা HTML ফাইলে দেবেন না। Payment verification server-এ হয়; UTR/ছবি দিয়ে auto-credit হয় না।</p></div>`;
};
function goldSaveApiUrl(){const v=(document.getElementById('goldApiUrl')?.value||'').trim().replace(/\/$/,'');if(v&&!/^https:\/\//i.test(v)&&!/^http:\/\/localhost(:\d+)?$/i.test(v)){toast('Live backend-এর জন্য HTTPS URL দিন।');return;}if(!v){localStorage.removeItem('goldApiBase');toast('API URL মুছে দেওয়া হয়েছে।');return;}localStorage.setItem('goldApiBase',v);document.getElementById('goldApiStatus').textContent='URL saved. এখন Test Database Connection চাপুন।';toast('API URL এই browser-এ save হয়েছে।');}
async function goldTestApi(){const status=document.getElementById('goldApiStatus');if(!goldApiBase()){status.textContent='API URL দিন এবং Save API URL চাপুন।';return;}status.textContent='Connecting…';try{const d=await goldApi('/api/health',{headers:{}});status.textContent='Connected ✓ Database: '+d.database+' | Payment gateway configured: '+(d.paymentsConfigured?'Yes':'No');}catch(e){status.textContent='Connection failed: '+e.message;}}
// Refresh online wallet balance when opening the account page. Local demo remains available if no API URL is set.
const goldBaseShowAccount=showAccount;
showAccount=async function(){if(goldApiBase()&&goldApiToken()){try{const me=await goldApi('/api/me');demoSession={loggedIn:true,username:me.user.username,accountId:me.user.accountId};demoProfile={name:me.user.displayName,email:me.user.username.includes('@')?me.user.username:'',avatar:''};await goldRefreshWallet();}catch(e){if(/login again|Account not found/i.test(e.message)){localStorage.removeItem('goldApiToken');toast('Online session শেষ হয়েছে। আবার login করুন।');}}}return goldBaseShowAccount();};

</script>
</body></html>
